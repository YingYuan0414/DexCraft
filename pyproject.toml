[project]
name = "dexcraft"
version = "0.1.0"
description = "DexCraft: dexterous tool-use benchmark with MimicGen data generation and Dexonomy grasp trajectories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ email = "yingyua2@cs.cmu.edu", name = "Ying Yuan" }]
dependencies = [
    "numpy==1.26.4",
    "setuptools<81",
    "sapien==3.0.0b1",
    "mani-skill>=3.0.0b21,<4",
    "gymnasium>=0.29.1,<0.30",
    "h5py",
    "scipy",
    "tqdm",
    "transforms3d",
    "tyro",
    "pip>=25.1.1,<26",
    "mimicgen @ git+https://github.com/NVlabs/mimicgen.git@72bd767c255545f462e7ccfb2731f2e5d4c1d9bb",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@b9d8d3de5e3dfd1724f4a0e6555246c460407daa",
    "mujoco==2.3.2",
    # SAPIEN uses pinocchio for the end-effector controller's IK when it is installed (otherwise a built-in
    # version with slightly different numerics); the DexCraft demos were generated with pin 2.7.0.
    "pin==2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dexcraft*"]

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "strict"
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.10.*"
numpy = "==1.26.4"
pytorch = "2.4.*"
torchvision = "0.19.*"
torchaudio = "2.4.*"
pytorch-cuda = "12.1.*"

[tool.pixi.pypi-dependencies]
dexcraft = { path = ".", editable = true }

[tool.pixi.pypi-options.dependency-overrides]
# Dexonomy trajectory collection uses the mplib>=0.2 API. ManiSkill pins mplib==0.1.1, but only uses it in its
# motion planning examples, which DexCraft does not use.
mplib = "==0.2.1"

[tool.pixi.tasks]
# pytorch3d (farthest point sampling for point-cloud observations) must be built against the installed torch
install-pytorch3d = """
pip uninstall pytorch3d -y && \
pip install --no-build-isolation git+https://github.com/facebookresearch/pytorch3d.git@stable
"""
# robomimic version required by MimicGen; installed without dependencies to keep the pinned torch / numpy
install-robomimic = """
pip install --no-build-isolation --no-deps \
git+https://github.com/ARISE-Initiative/robomimic.git@d0b37cf214bd24fb590d182edb6384333f67b661
"""
